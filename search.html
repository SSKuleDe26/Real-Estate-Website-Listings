<section class="container my-5">

    <h2 class="text-center mb-4">
        Search Properties
    </h2>

    <div class="row g-3">

        <div class="col-md-4">
            <label class="form-label">Home Type</label>

            <select id="type" class="form-select">
                <option value="">Any</option>
                <option>House</option>
                <option>Apartment</option>
                <option>Villa</option>
                <option>Condo</option>
                <option>Cottage</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">City</label>

            <select id="city" class="form-select">
                <option value="">Any</option>
                <option>Orlando</option>
                <option>Tampa</option>
                <option>Miami</option>
                <option>Kissimmee</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Bedrooms</label>

            <select id="bedrooms" class="form-select">
                <option value="">Any</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Bathrooms</label>

            <select id="bathrooms" class="form-select">
                <option value="">Any</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
            </select>
        </div>

        <div class="col-md-6">
            <label class="form-label">Garage Spaces</label>

            <select id="garage" class="form-select">
                <option value="">Any</option>
                <option>1</option>
                <option>2</option>
                <option>3</option>
            </select>
        </div>
    <div class="row" id="results"></div>
    </div>

    <div class="text-center mt-4">

        <button
            class="btn btn-primary px-5"
            onclick="searchProperties()">

            Search

        </button>

    </div>

</section>

<section class="container mb-5">

    <h2 class="text-center mb-4">
        Search Results
    </h2>

    <div id="results" class="row gy-4">

    </div>
